name: lint

# An allowlist is safe here, unlike in tests.yml: the glob covers any Python file wherever it
# lands, so a new one cannot slip past the filter.
on:
  push:
    branches: [main]
    paths: ['**.py', 'ruff.toml', '.github/workflows/lint.yml']
  pull_request:
    paths: ['**.py', 'ruff.toml', '.github/workflows/lint.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installed with pip at a pinned version rather than through a setup action, which would
      # add a third-party action to pin and watch for the sake of one binary.
      - name: Install ruff
        run: python3 -m pip install --disable-pip-version-check ruff==0.16.5

      - name: Format (check only)
        run: ruff format --check .

      - name: Lint
        run: ruff check .
